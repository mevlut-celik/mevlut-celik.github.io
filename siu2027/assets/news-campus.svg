<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="campusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B49" />
      <stop offset="100%" stop-color="#001424" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#campusGrad)" />
  <!-- Stylized Campus / Modern Architectural Silhouette -->
  <path d="M60 260L160 140L240 260H60Z" fill="rgba(0,163,224,0.18)"/>
  <path d="M180 260L290 100L400 260H180Z" fill="rgba(0,163,224,0.28)"/>
  <path d="M340 260L460 130L580 260H340Z" fill="rgba(0,163,224,0.2)"/>
  <!-- Campus Window Dots -->
  <g fill="#FFFFFF" opacity="0.6">
    <rect x="270" y="160" width="8" height="12"/>
    <rect x="290" y="160" width="8" height="12"/>
    <rect x="310" y="160" width="8" height="12"/>
    <rect x="270" y="190" width="8" height="12"/>
    <rect x="290" y="190" width="8" height="12"/>
    <rect x="310" y="190" width="8" height="12"/>
    <rect x="270" y="220" width="8" height="12"/>
    <rect x="290" y="220" width="8" height="12"/>
    <rect x="310" y="220" width="8" height="12"/>
  </g>
  <!-- Base Ground Line -->
  <line x1="40" y1="260" x2="600" y2="260" stroke="#00A3E0" stroke-width="3"/>
  <text x="320" y="300" font-family="'Open Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle">İSTANBUL MEDİPOL ÜNİVERSİTESİ</text>
  <text x="320" y="326" font-family="'Open Sans', sans-serif" font-weight="600" font-size="13" fill="#00A3E0" text-anchor="middle">KAVACIK GÜNEY KAMPÜSÜ • KONGRE VE KÜLTÜR MERKEZİ</text>
</svg>
