  <!-- Otel haritası: Leaflet + OpenStreetMap -->
  <link rel="stylesheet" href="assets/leaflet/leaflet.css?v=18">
  <script src="assets/leaflet/leaflet.js?v=18" defer></script>
  <script defer>
    window.addEventListener('load', function () {
      var el = document.getElementById('otelHarita');
      if (!el || typeof L === 'undefined') return;

      var kampus = [41.08679, 29.08895];
      var oteller = [{"n": "Limak Eurasia Luxury Hotel", "lat": 41.09201, "lon": 29.09745}, {"n": "Bilek Hotel Istanbul", "lat": 41.09162, "lon": 29.09384}, {"n": "A'ija Hotel", "lat": 41.10307, "lon": 29.06691}];

      var harita = L.map(el, { scrollWheelZoom: false }).setView([41.0895, 29.0890], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> katkıcıları'
      }).addTo(harita);

      L.marker(kampus).addTo(harita)
        .bindPopup('<strong>SİU 2027 Kurultay Alanı</strong><br>İstanbul Medipol Üniversitesi<br>Kavacık Güney Yerleşkesi')
        .openPopup();

      oteller.forEach(function (o) {
        L.circleMarker([o.lat, o.lon], {
          radius: 8, color: '#002B49', weight: 2, fillColor: '#00A3E0', fillOpacity: 0.9
        }).addTo(harita).bindPopup(
          '<strong>' + o.n + '</strong><br>' +
          '<a href="https://www.google.com/maps/search/?api=1&query=' + o.lat + ',' + o.lon +
          '" target="_blank" rel="noopener">Google Haritalar\'da aç</a>'
        );
      });

      harita.fitBounds(
        L.latLngBounds([kampus].concat(oteller.map(function (o) { return [o.lat, o.lon]; }))).pad(0.25)
      );

      // --- Ulaşım bölümü: kampüs ve çevresindeki duraklar ---
      var kampusEl = document.getElementById('kampusHarita');
      if (!kampusEl) return;

      var duraklar = [
        { ad: 'Kavacık Sapağı', lat: 41.08852, lon: 29.09054 },
        { ad: 'Kavacık', lat: 41.08812, lon: 29.08649 },
        { ad: 'Kavacık', lat: 41.08910, lon: 29.08895 },
        { ad: 'Atatürk Caddesi', lat: 41.08843, lon: 29.08646 },
        { ad: 'Kavacık Köprüsü', lat: 41.08952, lon: 29.08995 },
        { ad: 'Göksu Evleri', lat: 41.08600, lon: 29.08579 }
      ];

      var kh = L.map(kampusEl, { scrollWheelZoom: false }).setView(kampus, 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> katkıcıları'
      }).addTo(kh);

      L.marker(kampus).addTo(kh)
        .bindPopup('<strong>SİU 2027 Kurultay Alanı</strong><br>Kavacık Güney Yerleşkesi<br>Kongre ve Kültür Merkezi')
        .openPopup();

      duraklar.forEach(function (d) {
        L.circleMarker([d.lat, d.lon], {
          radius: 6, color: '#002B49', weight: 2, fillColor: '#00A3E0', fillOpacity: 0.9
        }).addTo(kh).bindPopup('<strong>' + d.ad + '</strong><br>Otobüs durağı');
      });

      kh.fitBounds(
        L.latLngBounds([kampus].concat(duraklar.map(function (d) { return [d.lat, d.lon]; }))).pad(0.45)
      );
    });
  </script>
