            <span class="section__num" aria-hidden="true">01</span>
            <h2 id="sekreterlik-title" i18n="il002"></h2>
            <p class="visually-hidden" i18n="il001"></p>

          <div class="section__body">
            <dl class="facts contact-facts">
              <div>
                <dt i18n="il003"></dt>

              <div>

        <section class="section" id="form" aria-labelledby="form-title">
          <div class="section__head">
            <span class="section__num" aria-hidden="true">02</span>
            <h2 id="form-title" i18n="il012"></h2>
            <p class="visually-hidden" i18n="il011"></p>
          </div>
          <div class="section__body">
            <form class="form" id="contactForm" action="mailto:siu2027@medipol.edu.tr" method="post" enctype="text/plain">
              <div class="form-grid">
                <div class="form-row">
                  <label for="cfName" i18n="il013"></label>
                  <input type="text" id="cfName" name="ad_soyad" required autocomplete="name">
                </div>
                <div class="form-row">
                  <label for="cfMail" i18n="il014"></label>
                  <input type="email" id="cfMail" name="eposta" required autocomplete="email">
                </div>
              </div>
              <div class="form-row">
                <label for="cfOrg" i18n="il015"></label>
                <input type="text" id="cfOrg" name="kurum" autocomplete="organization">
              </div>
              <div class="form-row">
                <label for="cfSubject" i18n="il016"></label>
                <select id="cfSubject" name="konu" required>
                  <option value="" i18n="il017"></option>
                  <option value="cmt" i18n="il018"></option>
                  <option value="kayit" i18n="il019"></option>
                  <option value="ozel-oturum" i18n="il020"></option>
                  <option value="yarisma" i18n="il021"></option>
                  <option value="sponsorluk" i18n="il022"></option>
                  <option value="diger" i18n="il023"></option>
                </select>
              </div>
              <div class="form-row">
                <label for="cfMessage" i18n="il024"></label>
                <textarea id="cfMessage" name="mesaj" rows="6" required></textarea>
              </div>
              <label class="form-check" for="cfKvkk">
                <input type="checkbox" id="cfKvkk" name="kvkk_onay" required>
                <span i18n="il025"></span>
              </label>
              <div class="form-actions">
                <button type="submit" class="btn btn--primary" i18n="il026"></button>
              </div>
              <p class="form-help" i18n="il027"></p>
            </form>
          </div>
        </section>
