<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yanıtlar | Araştırma Anketi</title>
<meta name="robots" content="noindex">
<link rel="icon" href="./assets/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="./assets/css/main.css">
</head>

<body>
<!-- ============================== NAV ============================== -->
<header class="nav">
  <div class="nav__inner">
    <img class="nav__logo" src="./assets/img/logo.png" alt="ODTÜ" width="630" height="250">
    <p class="nav__title">Fizik Eğitiminde Öğretmen Fark Etme Becerisi<br>Araştırma Anketi</p>
  </div>
</header>

<main class="band">
  <div class="band__inner band__inner--wide">
    <p class="eyebrow">Yönetim</p>
    <h1 class="display display--lg">Form yanıtları</h1>

    <div class="stats">
      <p class="stat"><span class="stat__value" id="stat-people">–</span><br><span class="stat__label">Katılımcı</span></p>
      <p class="stat"><span class="stat__value" id="stat-rows">–</span><br><span class="stat__label">Seçilen ifade (satır)</span></p>
      <p class="stat"><span class="stat__value" id="stat-volunteers">–</span><br><span class="stat__label">Görüşme gönüllüsü</span></p>
    </div>

    <div class="toolbar">
      <input class="input" type="search" id="admin-search" placeholder="Yanıtlarda ara…" aria-label="Yanıtlarda ara">
      <div class="toolbar__group">
        <span class="hint" id="admin-count"></span>
        <button class="btn btn--ghost" type="button" id="admin-refresh">Verileri yenile</button>
        <button class="btn btn--success" type="button" id="admin-export">Excel'e aktar</button>
      </div>
    </div>

    <p class="notice" id="admin-status" hidden></p>

    <div class="table-wrap">
      <table class="table">
        <thead id="responsesTableHead"></thead>
        <tbody id="responsesTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- ============================= FOOTER ============================= -->
<footer class="footer">
  <p class="footer__inner">ODTÜ Eğitim Fakültesi &middot; Matematik ve Fen Bilimleri Eğitimi Bölümü &middot; <span data-year>2026</span></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="./assets/js/main.js" defer></script>
</body>
</html>
